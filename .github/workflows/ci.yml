name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install


      - name: Export normalized lockfile (temporary)
        run: |
          echo "LOCKFILE_EXPORT_BEGIN"
          base64 -w 76 package-lock.json
          echo "LOCKFILE_EXPORT_END"

      - name: Build the project
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Check code formatting
        run: npm run format -- --check

